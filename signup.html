<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | Vidlyra Fest 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#081226,#10274b);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:400px;
    background:#13284d;
    padding:35px;
    border-radius:18px;
    box-shadow:0 0 30px rgba(0,229,255,.15);
}

h2{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#b8d8ff;
    margin-bottom:25px;
    font-size:14px;
}

.input-group{
    position:relative;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:13px 45px 13px 14px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

input:focus{
    box-shadow:0 0 8px #00E5FF;
}

.toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    user-select:none;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#00bfff;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0099dd;
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.auth-links{
    margin-top:20px;
    text-align:center;
    font-size:15px;
}

.auth-links a{
    color:#00E5FF;
    text-decoration:none;
    font-weight:bold;
}

.auth-links a:hover{
    text-decoration:underline;
}

#message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
    min-height:20px;
}

.success{
    color:#00ff88;
}

.error{
    color:#ff5a5a;
}

@media(max-width:500px){
    .container{
        padding:25px;
    }
}
</style>

</head>

<body>

<div class="container">

<h2>Create Vidlyra Account</h2>

<p class="subtitle">
Join the Vidlyra Universe
</p>

<form onsubmit="signup(event)">

<div class="input-group">
<input
type="text"
id="fullname"
placeholder="Full Name"
required
autocomplete="name">
</div>

<div class="input-group">
<input
type="email"
id="email"
placeholder="Email Address"
required
autocomplete="email">
</div>

<div class="input-group">
<input
type="password"
id="password"
placeholder="Password"
required
minlength="6"
autocomplete="new-password">

<span class="toggle"
onclick="togglePassword('password',this)">👁</span>
</div>

<div class="input-group">
<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required
minlength="6"
autocomplete="new-password">

<span class="toggle"
onclick="togglePassword('confirmPassword',this)">👁</span>
</div>

<button id="signupBtn" type="submit">
Create Account
</button>

</form>

<div class="auth-links">
<p>
Already have an account?
<a href="login.html">Login</a>
</p>
</div>

<p id="message"></p>

</div>

<script>
function togglePassword(id,icon){

const input=document.getElementById(id);

if(input.type==="password"){
    input.type="text";
    icon.innerHTML="🙈";
}else{
    input.type="password";
    icon.innerHTML="👁";
}

}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/signup.js"></script>

</body>

</html>
